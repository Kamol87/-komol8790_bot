<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATABEKOV Каталог</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
margin:0;
}

h1{
text-align:center;
}

.form{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

#catalog{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:140px;
object-fit:cover;
}

.info{
padding:10px;
}
</style>

</head>
<body>

<h1>ATABEKOV Каталог</h1>

<div class="form">

<input type="text" id="name" placeholder="Название товара">

<input type="number" id="price" placeholder="Цена">

<input type="file" id="photo" accept="image/*">

<button onclick="addProduct()">Добавить товар</button>

</div>

<div id="catalog"></div>

<script>

function addProduct(){

let name=document.getElementById("name").value;
let price=document.getElementById("price").value;
let photo=document.getElementById("photo").files[0];

if(!name || !price || !photo){
alert("Заполните все поля");
return;
}

let reader=new FileReader();

reader.onload=function(e){

document.getElementById("catalog").innerHTML += `
<div class="card">
<img src="${e.target.result}">
<div class="info">
<h3>${name}</h3>
<p>${price} сум</p>
</div>
</div>
`;

};

reader.readAsDataURL(photo);

}

</script>

</body>
</html>
